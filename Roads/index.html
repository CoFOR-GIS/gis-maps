/* CoFOR GIS components. Every value is a token from tokens.json (tokens.css).

.cfr { font-family: var(--font-sans); color: var(--text-ink); -webkit-font-smoothing: antialiased; }
.cfr *, .cfr *::before, .cfr *::after { box-sizing: border-box; }
.cfr :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* ---------- Masthead ---------- */
.cfr-masthead { display: flex; align-items: center; gap: var(--space-4); padding: 18px var(--space-6);
  background: var(--bg-card); border-bottom: 2px solid var(--brand-sage); }
.cfr-masthead__mark { height: 42px; width: auto; flex: none; display: block; }
.cfr-masthead__titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cfr-masthead__title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px;
  line-height: 1.05; color: var(--text-heading); }
.cfr-masthead__org { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.4; color: var(--text-muted); }
.cfr-masthead__org b { color: var(--text-heading); font-weight: 600; }
.cfr-masthead--admin { background: var(--dept-admin); border-bottom-color: var(--brand-gold); }
.cfr-masthead--admin .cfr-masthead__title, .cfr-masthead--admin .cfr-masthead__org b { color: var(--brand-cream); }
.cfr-masthead--admin .cfr-masthead__org, .cfr-masthead--admin .cfr-eyebrow { color: var(--brand-tan); }

/* ---------- Eyebrow ---------- */
.cfr-eyebrow { font-size: 11px; line-height: 14px; letter-spacing: .16em; text-transform: uppercase;
  font-weight: 700; color: var(--text-accent); }

/* ---------- Button ---------- */
.cfr-btn { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/16px var(--font-sans);
  padding: 9px 14px; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s; }
.cfr-btn--primary { background: var(--action-primary); color: var(--action-primary-text); }
.cfr-btn--primary:hover { background: var(--action-primary-hover); }
.cfr-btn--secondary { background: var(--bg-card); color: var(--text-heading); border-color: var(--line);
  box-shadow: var(--shadow-control); }
.cfr-btn--secondary:hover { border-color: var(--brand-sage); }
.cfr-btn--outline { background: transparent; color: var(--text-ink); border-color: var(--line-strong); }
.cfr-btn--outline:hover { border-color: var(--text-muted); background: var(--bg-page); }
.cfr-btn--danger { background: var(--status-error-wash); color: var(--status-error); border-color: var(--status-error); }
.cfr-btn--small { font-size: 12px; padding: 6px 11px; }
.cfr-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Segmented control ---------- */
.cfr-segmented { display: inline-flex; gap: 3px; padding: 3px; background: var(--bg-page);
  border: 1px solid var(--line); border-radius: 9px; }
.cfr-segmented button { border: none; background: none; font: 600 12.5px/16px var(--font-sans);
  color: var(--text-muted); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; }
.cfr-segmented button[aria-pressed="true"] { background: var(--action-primary); color: var(--action-primary-text); }
.cfr-segmented button[disabled] { opacity: .38; cursor: default; }

/* ---------- Stat band (KPI) ---------- */
.cfr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px;
  background: var(--line); border-block: 1px solid var(--line); }
.cfr-stat { background: var(--bg-page); padding: 18px var(--space-6); }
.cfr-stat__label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  color: var(--text-muted); margin-bottom: 6px; }
.cfr-stat__label em { font-style: normal; color: var(--text-accent); }
.cfr-stat__value { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; color: var(--text-heading); }
.cfr-stat__unit { font: 600 .45em var(--font-sans); color: var(--text-muted); margin-left: 6px; }

/* ---------- Panel ---------- */
.cfr-panel { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: var(--space-5); box-shadow: var(--shadow-sm); }
.cfr-panel__title { margin: 0 0 4px; font: 600 19px/24px var(--font-display); color: var(--text-heading); }
.cfr-panel__sub { margin: 0 0 14px; font-size: 12.5px; line-height: 19px; color: var(--text-muted); }

/* ---------- Field ---------- */
.cfr-field { display: flex; flex-direction: column; gap: 5px; }
.cfr-field label { font-size: 12px; font-weight: 600; color: var(--text-ink); }
.cfr-field input, .cfr-field select { font: 400 13.5px/20px var(--font-sans); color: var(--text-ink);

.cfr-field input.is-code { font-family: var(--font-mono); font-size: 12px; }
.cfr-field input:focus { outline: none; border-color: var(--brand-sage); box-shadow: 0 0 0 3px var(--sage-wash); }

.cfr-field__hint { font-size: 11.5px; line-height: 16px; color: var(--text-muted); }
.cfr-field__hint.is-error { color: var(--status-error); }

/* ---------- Toggle ---------- */
.cfr-toggle { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; cursor: pointer; }
.cfr-toggle input { appearance: none; margin: 0; width: 34px; height: 19px; border-radius: var(--radius-pill);
  background: var(--bg-sunken); border: 1px solid var(--line-strong); position: relative; cursor: pointer; transition: all .2s; }
.cfr-toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
  border-radius: 50%; background: var(--text-muted); transition: all .2s; }
.cfr-toggle input:checked { background: var(--sage-wash); border-color: var(--brand-sage); }
.cfr-toggle input:checked::after { left: 17px; background: var(--brand-sage); }

/* ---------- Status bar ---------- */
.cfr-status { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border-radius: var(--radius-sm);
  border: 1px solid; font-size: 12.5px; line-height: 18px; font-weight: 500; }
.cfr-status__icon { font-weight: 700; flex: none; width: 16px; text-align: center; }
.cfr-status--info { background: var(--status-info-wash); border-color: var(--status-info); color: var(--status-info); }
.cfr-status--success { background: var(--status-success-wash); border-color: var(--status-success); color: var(--status-success); }
.cfr-status--warning { background: var(--status-warning-wash); border-color: var(--status-warning); color: var(--status-warning); font-weight: 700; }
.cfr-status--error { background: var(--status-error-wash); border-color: var(--status-error); color: var(--status-error); }

/* ---------- Tag ---------- */
.cfr-tag { display: inline-block; font: 600 11px/16px var(--font-mono); padding: 1px 6px; border-radius: var(--radius-xs); }
.cfr-tag--sage { background: var(--sage-wash); color: var(--text-accent); }
.cfr-tag--success { background: var(--status-success-wash); color: var(--status-success); }
.cfr-tag--info { background: var(--status-info-wash); color: var(--status-info); }
.cfr-tag--warning { background: var(--status-warning-wash); color: var(--status-warning); }
.cfr-tag--error { background: var(--status-error-wash); color: var(--status-error); }
.cfr-tag--muted { background: var(--bg-sunken); color: var(--text-ink); }

/* ---------- Legend + share band ---------- */
.cfr-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--text-muted); }
.cfr-legend__key { display: inline-block; width: 15px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.cfr-band { height: 9px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; display: flex; }
.cfr-band > span { height: 100%; }

/* ---------- Popup card (inside the ArcGIS popup) ---------- */
.cfr-popcard { display: flex; min-width: 210px; font-family: var(--font-sans); }
.cfr-popcard__bar { width: 5px; border-radius: 3px; background: var(--popcard-accent, var(--brand-navy)); margin-right: 13px; flex: none; }
.cfr-popcard__value { font: 700 30px/1 var(--font-display); color: var(--text-heading); margin-top: 4px; }
.cfr-popcard__value span { font: 600 13px var(--font-sans); color: var(--text-muted); margin-left: 6px; }
.cfr-popcard__addr { font-size: 13px; color: var(--text-ink); margin-top: 7px; }

/* ---------- Menu ---------- */
.cfr-menu { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-overlay); overflow: hidden; min-width: 168px; }
.cfr-menu__group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
  color: var(--text-muted); padding: 9px 14px 4px; }
.cfr-menu button { display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 10px 14px; font: 400 13px var(--font-sans); color: var(--text-ink); cursor: pointer; }
.cfr-menu button:hover { background: var(--bg-page); color: var(--text-heading); }

/* ---------- Loading / empty state ---------- */
.cfr-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: var(--space-6); text-align: center; font-size: 13.5px; color: var(--text-muted); background: var(--bg-page); }
.cfr-state b { font-size: 15px; color: var(--text-heading); }
.cfr-spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line);
  border-top-color: var(--brand-sage); animation: cfr-spin .8s linear infinite; }
@keyframes cfr-spin { to { transform: rotate(360deg); } }

/* ---------- Banner (over the map) ---------- */
.cfr-banner { display: inline-block; background: var(--bg-inverse); color: var(--text-inverse); font-size: 12.5px;
  line-height: 18px; padding: 9px 14px; border-radius: var(--radius-md); box-shadow: var(--shadow-overlay); max-width: 80%; }

/* ---------- Footer ---------- */
.cfr-footer { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px var(--space-6); background: var(--bg-card);
  border-top: 1px solid var(--line); font-size: 11px; color: var(--text-muted); }
.cfr-footer__dot { color: var(--brand-sage); }

@media (prefers-reduced-motion: reduce) { .cfr-spinner { animation: none; } .cfr-btn, .cfr-toggle input { transition: none; } }

      .class-arterial   { background: #f0d5d7; color: var(--cfor-red); }

      /* === Info Panel === */
      .info-panel {
        position: absolute; bottom: 16px; left: 16px;
        background: var(--cfor-white); border-radius: 8px;
        box-shadow: 0 2px 16px rgba(0,0,0,.14);
        padding: 12px 16px; max-width: 280px; z-index: 5;
        transition: opacity .3s ease, transform .3s ease;
        border-left: 3px solid var(--cfor-tan);
      }
      .info-panel.collapsed { opacity: 0; transform: translateY(10px); pointer-events: none; }
      .info-panel-title {
        font-family: var(--font-heading); font-weight: 600;
        font-size: 12px; color: var(--cfor-dark-blue);
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
      }
      .info-panel p { font-size: 12px; color: var(--cfor-gray-warm); line-height: 1.5; }
      .info-panel-close {
        position: absolute; top: 8px; right: 10px;
        background: none; border: none; cursor: pointer;
        font-size: 16px; color: var(--cfor-gray-warm); line-height: 1;
      }
      .info-panel-close:hover { color: var(--cfor-charcoal); }
      .info-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .info-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--cfor-charcoal); }
      .info-legend-swatch { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }

      .table-toggle {
        position: absolute; top: 10px; right: 10px; z-index: 6;
        background: var(--cfor-white); border: 1px solid #ccc; border-radius: 6px;
        padding: 6px 12px; font-family: var(--font-heading);
        font-size: 11px; font-weight: 600; color: var(--cfor-dark-blue);
        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none;
      }

      @media (max-width: 480px) {
        .app-header.cfr-masthead { padding: 8px 12px; }
      }

      @media (max-width: 800px) {
        .app-header .cfr-masthead__title { font-size: 18px; }
        .info-panel { max-width: 220px; }
        .main-content { flex-direction: column; }
        .table-panel {
          width: 100%; height: 0; overflow: hidden;
          border-left: none; border-top: 1px solid #ddd;
          transition: height 0.3s ease;
        }
        .table-panel.open { height: 45vh; }
        .table-toggle { display: block; }
      }
    </style>
  </head>

  <body>
    <div class="app-shell cfr">

      <!-- Header -->
      <header class="app-header cfr-masthead cfr-masthead--admin">
        <img class="cfr-masthead__mark" src="logo.svg" alt="City of Fair Oaks Ranch seal" />
        <div class="cfr-masthead__titles">
          <span class="cfr-eyebrow">City of Fair Oaks Ranch · Public Works</span>
          <h1 class="cfr-masthead__title">Road Information Map</h1>
        </div>
      </header>

      <!-- Main -->
      <div class="main-content">

        <!-- Map -->
        <div class="map-panel">
          <arcgis-map basemap="gray-vector" center="-98.69, 29.745" zoom="12">
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <arcgis-search slot="top-right" include-default-sources-disabled></arcgis-search>
          </arcgis-map>

          <div class="info-panel" id="infoPanel">
            <button class="info-panel-close" id="infoPanelClose" title="Close">&times;</button>
            <div class="info-panel-title">How to use this map</div>
            <p>Click any road segment for details. Use search or the road directory to find a road by name.</p>
            <div class="info-legend">
              <div class="info-legend-item"><div class="info-legend-swatch" style="background:#9c9c9c;height:2px;"></div>Local</div>
              <div class="info-legend-item"><div class="info-legend-swatch" style="background:#7ca3bf;height:3px;"></div>Connector</div>
              <div class="info-legend-item"><div class="info-legend-swatch" style="background:#c9a227;height:4px;"></div>Collector</div>
              <div class="info-legend-item"><div class="info-legend-swatch" style="background:#A64850;height:5px;"></div>Arterial</div>
            </div>
          </div>

          <button class="table-toggle" id="tableToggle">Show Road List</button>
        </div>

        <!-- Road Directory Table -->
        <div class="table-panel" id="tablePanel">
          <div class="table-header">
            <span class="table-header-title">Road Directory</span>
            <span class="table-count" id="tableCount"></span>
          </div>
          <input type="text" class="table-filter" id="tableFilter" placeholder="Filter roads..." />
          <div class="table-scroll">
            <table class="road-table" id="roadTable">
              <thead>
                <tr>
                  <th data-sort="name">Road Name <span class="sort-arrow">&#9650;</span></th>
                  <th data-sort="class" class="col-center">Class <span class="sort-arrow">&#9650;</span></th>
                  <th data-sort="speed" class="col-center">Speed <span class="sort-arrow">&#9650;</span></th>
                  <th data-sort="length" class="col-right">Length <span class="sort-arrow">&#9650;</span></th>
                </tr>
              </thead>
              <tbody id="roadTableBody">
                <tr><td colspan="4" style="padding:20px;color:#999;text-align:center;">Loading roads...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

    <!-- ============================================================
         MAP LOGIC
         ============================================================ -->
    <script type="module">
      const [
        FeatureLayer, ClassBreaksRenderer, SimpleLineSymbol,
        SearchSource, Graphic
      ] = await $arcgis.import([
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/renderers/ClassBreaksRenderer.js",
        "@arcgis/core/symbols/SimpleLineSymbol.js",
        "@arcgis/core/widgets/Search/SearchSource.js",
        "@arcgis/core/Graphic.js"
      ]);

      var viewElement = document.querySelector("arcgis-map");
      var searchElement = document.querySelector("arcgis-search");
      await viewElement.viewOnReady();

      // ==========================================================
      // CENTER MAP ON JURISDICTIONAL BOUNDARY
      // Query the boundary layer extent and goTo with padding
      // to account for the 380px table panel on the right
      // ==========================================================
      var jurisdictionalLayer = new FeatureLayer({
        url: "https://services6.arcgis.com/Cnwpb7mZuifVHE6A/arcgis/rest/services/FOR_Jurisdictional/FeatureServer/0"
      });

      jurisdictionalLayer.queryExtent({ where: "1=1" }).then(function (result) {
        if (result.extent) {
          viewElement.goTo(result.extent.expand(1.1), {
            padding: { right: 380 }
          });
        }
      }).catch(function (err) {
        console.warn("Could not query jurisdictional extent:", err);
      });

      // ==========================================================
      // HELPERS
      // ==========================================================
      function classLabel(rdType) {
        if (rdType <= 1) return "Local";
        if (rdType <= 2) return "Connector";
        if (rdType <= 3) return "Collector";
        if (rdType <= 4) return "Arterial";
        return "Other";
      }
      function classCss(rdType) {
        if (rdType <= 1) return "class-local";
        if (rdType <= 2) return "class-connector";
        if (rdType <= 3) return "class-collector";
        if (rdType <= 4) return "class-arterial";
        return "class-local";
      }
      function formatLength(ft) {
        if (ft == null) return "\u2014";
        if (ft >= 5280) return (ft / 5280).toFixed(2) + " mi";
        return Math.round(ft).toLocaleString() + " ft";
      }
      function escapeSQL(str) {
        return str.replace(/'/g, "''");
      }

      // ==========================================================
      // RENDERER — CFOR Brand Colors
      // ==========================================================
      var roadRenderer = new ClassBreaksRenderer({
        field: "RdType",
        classBreakInfos: [
          {
            minValue: 0, maxValue: 1, label: "Local Street",
            symbol: new SimpleLineSymbol({
              color: [156, 156, 156, 1], width: 1.2,
              style: "solid", cap: "round", join: "round"
            })
          },
          {
            minValue: 1.01, maxValue: 2, label: "Connector Street",
            symbol: new SimpleLineSymbol({
              color: [124, 163, 191, 1], width: 2.0,  /* Muted blue from Light Blue #B0C1C9 */
              style: "solid", cap: "round", join: "round"
            })
          },
          {
            minValue: 2.01, maxValue: 3, label: "Collector Road",
            symbol: new SimpleLineSymbol({
              color: [178, 163, 90, 1], width: 2.8,   /* Derived from Tan #D4CA96 darkened */
              style: "solid", cap: "round", join: "round"
            })
          },
          {
            minValue: 3.01, maxValue: 4, label: "Arterial Road",
            symbol: new SimpleLineSymbol({
              color: [166, 72, 80, 1], width: 3.5,     /* CFOR Red #A64850 */
              style: "solid", cap: "round", join: "round"
            })
          }
        ]
      });

      // ==========================================================
      // POPUPS
      // ==========================================================
      var segmentPopup = {
        title: "{FULL_NAME}",
        content:
          '<div style="font-family:DM Sans,sans-serif;font-size:12px;">' +
          '<table style="border-collapse:collapse;font-size:12px;width:100%;">' +
          '<tr><td style="padding:4px 6px;width:45%;color:#6b6b6b;">Classification</td>' +
            '<td style="padding:4px 6px;"><strong>{expression/ClassLabel}</strong></td></tr>' +
          '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">Maintenance</td>' +
            '<td style="padding:4px 6px;"><strong>{TxDot_Road}</strong></td></tr>' +
          '<tr><td style="padding:4px 6px;color:#6b6b6b;">County</td>' +
            '<td style="padding:4px 6px;"><strong>{County}</strong></td></tr>' +
          '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">Speed limit</td>' +
            '<td style="padding:4px 6px;"><strong>{expression/SpeedLimit}</strong></td></tr>' +
          '<tr><td style="padding:4px 6px;color:#6b6b6b;">Road width</td>' +
            '<td style="padding:4px 6px;"><strong>{Road_width} ft</strong></td></tr>' +
          '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">ROW width</td>' +
            '<td style="padding:4px 6px;"><strong>{ROW_width} ft</strong></td></tr>' +
          '<tr><td style="padding:4px 6px;color:#6b6b6b;">Segment length</td>' +
            '<td style="padding:4px 6px;"><strong>{expression/SegmentLength}</strong></td></tr>' +
          '</table></div>',
        expressionInfos: [
          {
            name: "SegmentLength",
            expression:
              'var ft = $feature["Shape__Length"];' +
              'if (IsEmpty(ft)) return "N/A";' +
              'if (ft >= 5280) return Round(ft / 5280, 2) + " mi";' +
              'return Round(ft, 0) + " ft";'
          },
          {
            name: "ClassLabel",
            expression:
              'var v = $feature["RdType"];' +
              'if (v <= 1) return "Local";' +
              'if (v <= 2) return "Connector";' +
              'if (v <= 3) return "Collector";' +
              'if (v <= 4) return "Arterial";' +
              'return "Other";'
          },
          {
            name: "SpeedLimit",
            expression:
              'var s = $feature["Speed_Limit"];' +
              'if (IsEmpty(s) || s == 0) return "30 mph (prima facie)";' +
              'return s + " mph";'
          }
        ]
      };

      // ==========================================================
      // LAYERS
      // ==========================================================
      var segmentsLayer = new FeatureLayer({
        url: "https://services6.arcgis.com/Cnwpb7mZuifVHE6A/arcgis/rest/services/CoFORPW_Road_Public/FeatureServer/0",
        title: "Road Centerline",
        outFields: ["*"],
        renderer: roadRenderer,
        popupTemplate: segmentPopup,
        opacity: 0.9
      });

      var dissolvedLayer = new FeatureLayer({
        url: "https://services6.arcgis.com/Cnwpb7mZuifVHE6A/arcgis/rest/services/CoFORPW_Road_Dissolved/FeatureServer/0",
        title: "Road Names (Search)",
        outFields: ["FULL_NAME","SUM_Shape_Length","COUNT_Shape_Length","FIRST_RdType","MAX_Speed_Limit","FIRST_TxDot_Road","FIRST_County","MAX_Road_width","MAX_ROW_width"],
        visible: false,
        popupEnabled: false
      });

      viewElement.map.add(segmentsLayer);
      viewElement.map.add(dissolvedLayer);

      await dissolvedLayer.load();
      var segmentsLayerView = await viewElement.whenLayerView(segmentsLayer);

      // ==========================================================
      // SHARED: highlight + zoom + popup for a road name
      // ==========================================================
      var activeHighlights = [];

      function clearHighlights() {
        activeHighlights.forEach(function (h) { h.remove(); });
        activeHighlights = [];
      }

      function selectRoadByName(roadName) {
        clearHighlights();

        var dissolvedQuery = dissolvedLayer.queryFeatures({
          where: "FULL_NAME = '" + escapeSQL(roadName) + "'",
          outFields: ["*"],
          returnGeometry: true
        });

        var segmentsQuery = segmentsLayer.queryFeatures({
          where: "FULL_NAME = '" + escapeSQL(roadName) + "'",
          outFields: ["OBJECTID"],
          returnGeometry: true
        });

        Promise.all([dissolvedQuery, segmentsQuery]).then(function (results) {
          var dissolvedFeatures = results[0].features;
          var segmentFeatures = results[1].features;

          if (dissolvedFeatures.length === 0) return;

          var totalLength = 0, totalSegments = 0;
          var maxSpeed = null, maxRoadWidth = null, maxROWWidth = null;
          var rdType = null, maintenance = null, county = null;
          var combinedExtent = null;

          dissolvedFeatures.forEach(function (f) {
            var a = f.attributes;
            totalLength += (a.SUM_Shape_Length || 0);
            totalSegments += (a.COUNT_Shape_Length || 0);
            if (maxSpeed == null || (a.MAX_Speed_Limit || 0) > maxSpeed) maxSpeed = a.MAX_Speed_Limit;
            if (maxRoadWidth == null || (a.MAX_Road_width || 0) > maxRoadWidth) maxRoadWidth = a.MAX_Road_width;
            if (maxROWWidth == null || (a.MAX_ROW_width || 0) > maxROWWidth) maxROWWidth = a.MAX_ROW_width;
            if (rdType == null) rdType = a.FIRST_RdType;
            if (maintenance == null) maintenance = a.FIRST_TxDot_Road;
            if (county == null) county = a.FIRST_County;
            if (f.geometry && f.geometry.extent) {
              combinedExtent = combinedExtent ? combinedExtent.union(f.geometry.extent) : f.geometry.extent.clone();
            }
          });

          if (combinedExtent) {
            viewElement.goTo(combinedExtent.expand(1.5));
          }

          if (segmentFeatures.length > 0) {
            var oids = segmentFeatures.map(function (f) { return f.attributes.OBJECTID; });
            activeHighlights.push(segmentsLayerView.highlight(oids));
          }

          var lengthStr = formatLength(totalLength);
          var classStr = classLabel(rdType || 0);
          var speedStr = (maxSpeed && maxSpeed > 0) ? maxSpeed + ' mph' : '30 mph (prima facie)';

          var popupContent =
            '<div style="font-family:DM Sans,sans-serif;font-size:12px;">' +
            '<div style="background:#e8ebe2;border-left:3px solid #8D956C;padding:6px 10px;margin-bottom:8px;border-radius:3px;">' +
              '<span style="color:#192737;font-weight:600;">Road Summary</span>' +
              '<span style="color:#6b6b6b;font-size:11px;"> \u2014 click a segment for details</span>' +
            '</div>' +
            '<table style="border-collapse:collapse;font-size:12px;width:100%;">' +
            '<tr><td style="padding:4px 6px;width:45%;color:#6b6b6b;">Classification</td>' +
              '<td style="padding:4px 6px;"><strong>' + classStr + '</strong></td></tr>' +
            '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">Maintenance</td>' +
              '<td style="padding:4px 6px;"><strong>' + (maintenance || '\u2014') + '</strong></td></tr>' +
            '<tr><td style="padding:4px 6px;color:#6b6b6b;">County</td>' +
              '<td style="padding:4px 6px;"><strong>' + (county || '\u2014') + '</strong></td></tr>' +
            '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">Speed limit</td>' +
              '<td style="padding:4px 6px;"><strong>' + speedStr + '</strong></td></tr>' +
            '<tr><td style="padding:4px 6px;color:#6b6b6b;">Road width</td>' +
              '<td style="padding:4px 6px;"><strong>' + (maxRoadWidth ? maxRoadWidth + ' ft' : '\u2014') + '</strong></td></tr>' +
            '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">ROW width</td>' +
              '<td style="padding:4px 6px;"><strong>' + (maxROWWidth ? maxROWWidth + ' ft' : '\u2014') + '</strong></td></tr>' +
            '<tr><td style="padding:4px 6px;color:#6b6b6b;">Total length</td>' +
              '<td style="padding:4px 6px;"><strong>' + lengthStr + '</strong></td></tr>' +
            '<tr style="background:#f4f4f2;"><td style="padding:4px 6px;color:#6b6b6b;">Segments</td>' +
              '<td style="padding:4px 6px;"><strong>' + totalSegments + '</strong></td></tr>' +
            '</table></div>';

          var loc = combinedExtent ? combinedExtent.center : dissolvedFeatures[0].geometry;
          setTimeout(function () {
            viewElement.popup.open({
              title: roadName,
              content: popupContent,
              location: loc
            });
          }, 400);
        });
      }

      // ==========================================================
      // SEARCH — custom source, deduplicated
      // ==========================================================
      await searchElement.componentOnReady();

      var roadNameIndex = [];

      var customSearchSource = new SearchSource({
        placeholder: "Search roads (e.g. Dietz Elkhorn)",
        name: "Road Name",

        getSuggestions: function (params) {
          var term = params.suggestTerm.toLowerCase();
          var matches = roadNameIndex.filter(function (r) {
            return r.nameLower.indexOf(term) > -1;
          });
          matches.sort(function (a, b) {
            var aStarts = a.nameLower.indexOf(term) === 0 ? 0 : 1;
            var bStarts = b.nameLower.indexOf(term) === 0 ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
            return a.name.localeCompare(b.name);
          });
          return matches.slice(0, 8).map(function (r) {
            return { key: r.name, text: r.name, sourceIndex: params.sourceIndex };
          });
        },

        getResults: function (params) {
          var roadName = params.suggestResult ? params.suggestResult.text : params.suggestTerm;
          return dissolvedLayer.queryFeatures({
            where: "FULL_NAME = '" + escapeSQL(roadName) + "'",
            outFields: ["*"],
            returnGeometry: true
          }).then(function (result) {
            if (result.features.length === 0) return [];
            var combinedExtent = null;
            result.features.forEach(function (f) {
              if (f.geometry && f.geometry.extent) {
                combinedExtent = combinedExtent ? combinedExtent.union(f.geometry.extent) : f.geometry.extent.clone();
              }
            });
            var graphic = new Graphic({
              geometry: result.features[0].geometry,
              attributes: { FULL_NAME: roadName }
            });
            return [{
              extent: combinedExtent ? combinedExtent.expand(1.5) : null,
              feature: graphic,
              name: roadName
            }];
          });
        }
      });

      searchElement.sources = [customSearchSource];

      searchElement.addEventListener("arcgisSearchSelectResult", function (event) {
        var result = event.detail && event.detail.result;
        if (result && result.name) {
          selectRoadByName(result.name);
        }
      });

      searchElement.addEventListener("arcgisSearchClear", function () {
        clearHighlights();
        viewElement.popup.close();
      });

      // ==========================================================
      // ROAD TABLE
      // ==========================================================
      var allRoads = [];

      function renderTable(roads) {
        var tbody = document.getElementById("roadTableBody");
        document.getElementById("tableCount").textContent = roads.length + " roads";

        if (roads.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="padding:20px;color:#999;text-align:center;">No roads found</td></tr>';
          return;
        }

        var html = "";
        for (var i = 0; i < roads.length; i++) {
          var r = roads[i];
          html += '<tr data-name="' + r.name.replace(/"/g, '&quot;') + '">' +
            '<td>' + r.name + '</td>' +
            '<td class="col-center"><span class="class-badge ' + classCss(r.rdType) + '">' + classLabel(r.rdType) + '</span></td>' +
            '<td class="col-center">' + (r.speed ? r.speed : '30') + '</td>' +
            '<td class="col-right">' + formatLength(r.length) + '</td>' +
            '</tr>';
        }
        tbody.innerHTML = html;

        var rows = tbody.querySelectorAll("tr");
        for (var j = 0; j < rows.length; j++) {
          rows[j].addEventListener("click", function () {
            var name = this.getAttribute("data-name");
            selectRoadByName(name);
            var allRows = tbody.querySelectorAll("tr");
            for (var k = 0; k < allRows.length; k++) allRows[k].classList.remove("active");
            this.classList.add("active");
          });
        }
      }

      dissolvedLayer.queryFeatures({
        where: "1=1",
        outFields: ["OBJECTID","FULL_NAME","SUM_Shape_Length","FIRST_RdType","MAX_Speed_Limit","COUNT_Shape_Length"],
        returnGeometry: false,
        orderByFields: ["FULL_NAME ASC"]
      }).then(function (result) {
        var nameMap = {};
        result.features.forEach(function (f) {
          var a = f.attributes;
          var name = a.FULL_NAME || "Unnamed";
          if (!nameMap[name]) {
            nameMap[name] = { name: name, length: 0, rdType: a.FIRST_RdType, speed: a.MAX_Speed_Limit, segments: 0 };
          }
          nameMap[name].length += (a.SUM_Shape_Length || 0);
          nameMap[name].segments += (a.COUNT_Shape_Length || 0);
          if (a.MAX_Speed_Limit && (!nameMap[name].speed || a.MAX_Speed_Limit > nameMap[name].speed)) {
            nameMap[name].speed = a.MAX_Speed_Limit;
          }
          if (a.FIRST_RdType && (!nameMap[name].rdType || a.FIRST_RdType > nameMap[name].rdType)) {
            nameMap[name].rdType = a.FIRST_RdType;
          }
        });

        allRoads = Object.keys(nameMap).map(function (k) { return nameMap[k]; });
        allRoads.sort(function (a, b) { return a.name.localeCompare(b.name); });

        roadNameIndex = allRoads.map(function (r) {
          return { name: r.name, nameLower: r.name.toLowerCase() };
        });

        renderTable(allRoads);
      }).catch(function (err) {
        console.error("Road table load error:", err);
        document.getElementById("roadTableBody").innerHTML =
          '<tr><td colspan="4" style="padding:20px;color:#c00;text-align:center;">Failed to load roads</td></tr>';
      });

      // ==========================================================
      // TABLE FILTER
      // ==========================================================
      document.getElementById("tableFilter").addEventListener("input", function () {
        var term = this.value.toLowerCase().trim();
        var filtered = term
          ? allRoads.filter(function (r) { return r.name.toLowerCase().indexOf(term) > -1; })
          : allRoads;
        renderTable(filtered);
      });

      // ==========================================================
      // TABLE SORT
      // ==========================================================
      var currentSort = { field: "name", asc: true };

      var ths = document.querySelectorAll(".road-table th");
      for (var t = 0; t < ths.length; t++) {
        ths[t].addEventListener("click", function () {
          var field = this.getAttribute("data-sort");
          if (!field) return;
          if (currentSort.field === field) {
            currentSort.asc = !currentSort.asc;
          } else {
            currentSort.field = field;
            currentSort.asc = true;
          }

          var allTh = document.querySelectorAll(".road-table th");
          for (var i = 0; i < allTh.length; i++) {
            allTh[i].classList.remove("sorted");
            var arrow = allTh[i].querySelector(".sort-arrow");
            if (arrow) arrow.innerHTML = "&#9650;";
          }
          this.classList.add("sorted");
          this.querySelector(".sort-arrow").innerHTML = currentSort.asc ? "&#9650;" : "&#9660;";

          var term = document.getElementById("tableFilter").value.toLowerCase().trim();
          var roads = term
            ? allRoads.filter(function (r) { return r.name.toLowerCase().indexOf(term) > -1; })
            : allRoads.slice();

          roads.sort(function (a, b) {
            var va, vb;
            switch (currentSort.field) {
              case "name": va = a.name; vb = b.name; break;
              case "class": va = a.rdType || 0; vb = b.rdType || 0; break;
              case "speed": va = a.speed || 30; vb = b.speed || 30; break;
              case "length": va = a.length || 0; vb = b.length || 0; break;
              default: va = a.name; vb = b.name;
            }
            if (va < vb) return currentSort.asc ? -1 : 1;
            if (va > vb) return currentSort.asc ? 1 : -1;
            return 0;
          });

          renderTable(roads);
        });
      }

      // ==========================================================
      // HOVER HIGHLIGHT
      // ==========================================================
      var hoverHandle = null;

      viewElement.addEventListener("arcgisViewPointerMove", function (event) {
        if (activeHighlights.length > 0) return;
        viewElement.hitTest(event.detail.screenPoint).then(function (response) {
          if (hoverHandle) { hoverHandle.remove(); hoverHandle = null; }
          var result = response.results.find(function (r) {
            return r.graphic && r.graphic.layer === segmentsLayer;
          });
          if (result) {
            hoverHandle = segmentsLayerView.highlight(result.graphic);
          }
        });
      });

      viewElement.addEventListener("arcgisViewClick", function (event) {
        viewElement.hitTest(event.detail.screenPoint).then(function (response) {
          var hitRoad = response.results.find(function (r) {
            return r.graphic && r.graphic.layer === segmentsLayer;
          });
          if (!hitRoad) {
            clearHighlights();
            var rows = document.querySelectorAll("#roadTableBody tr");
            for (var i = 0; i < rows.length; i++) rows[i].classList.remove("active");
          }
        });
      });

      // ==========================================================
      // INFO PANEL DISMISS
      // ==========================================================
      document.getElementById("infoPanelClose").addEventListener("click", function () {
        document.getElementById("infoPanel").classList.add("collapsed");
      });

      // ==========================================================
      // MOBILE TABLE TOGGLE
      // ==========================================================
      document.getElementById("tableToggle").addEventListener("click", function () {
        var panel = document.getElementById("tablePanel");
        var isOpen = panel.classList.toggle("open");
        this.textContent = isOpen ? "Hide Road List" : "Show Road List";
      });
    </script>
  </body>
</html>
